[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-terminal"
version = "0.2.0"
description = "Recall — the AI brain for your terminal. It remembers everything, understands your context, and thinks ahead of you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Bilal Ur Rehman" }]
keywords = ["terminal", "cli", "ai", "developer-tools", "memory", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/mbilalrehman/recall-terminal"

[project.scripts]
recall = "recall.cli:main"

[tool.setuptools.packages.find]
include = ["recall*"]
